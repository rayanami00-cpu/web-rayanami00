<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayanami00 - Ruang Baca</title>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #021133 0%, #000412 100%);
            color: white; font-family: 'Mulish', sans-serif;
            padding: 20px 15px; min-height: 100vh; position: relative; overflow-x: hidden;
        }
        header { text-align: center; margin-bottom: 35px; margin-top: 10px; }
        .site-title { font-family: 'Kalam', cursive; font-size: 2.8rem; color: #E2E8F0; }

        .content-grid {
            max-width: 500px; margin: 0 auto;
            display: grid; grid-template-columns: 1fr 1fr; gap: 25px 20px;
        }
        .card { cursor: pointer; text-decoration: none; color: inherit; display: block; }
        .card:active { transform: scale(0.98); }
        .cover-area {
            background-color: #FFFFFF; width: 100%; padding-top: 150%;
            margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border-radius: 6px; background-size: cover; background-position: center;
        }
        .karya-judul { font-weight: 700; font-size: 0.95rem; color: #E2E8F0; margin-bottom: 4px; }
        .karya-tanggal { font-weight: 400; font-size: 0.8rem; color: #94A3B8; text-transform: uppercase; }

        .admin-slider {
            position: fixed; top: 18%; left: 0; width: 210px;
            background: linear-gradient(180deg, rgba(2, 22, 64, 0.96) 0%, rgba(1, 10, 31, 0.98) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15); border-left: none;
            border-radius: 0 24px 24px 0; padding: 30px 20px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 8px 8px 25px rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px); z-index: 100;
        }
        .profile-upload {
            width: 90px; height: 90px; border-radius: 50%; background-color: #FFFFFF;
            border: 3px solid #000412; display: flex; justify-content: center; align-items: center;
            color: #1E293B; font-size: 0.8rem; font-weight: 700; cursor: pointer;
            margin-bottom: 12px; overflow: hidden; background-size: cover; background-position: center;
        }
        .account-name { font-size: 0.95rem; color: #FFFFFF; font-weight: 600; margin-bottom: 22px; outline: none; }
        .btn-karya-baru {
            width: 100%; padding: 12px; border-radius: 50px; border: 2px solid #0f2b5c;
            background: rgba(2, 17, 51, 0.8); color: #FFFFFF; font-weight: 700;
            text-decoration: none; text-align: center; display: block;
        }
        .btn-back-login { display: block; text-align: center; margin-top: 50px; color: #64748b; text-decoration: none; }
    </style>
</head>
<body>

    <header><h1 class="site-title">rayanami00</h1></header>

    <aside id="adminSlider" class="admin-slider" style="display: none;">
        <label for="uploadPhotoInput" class="profile-upload" id="profileBox">
            <span id="profileText">add photo</span>
        </label>
        <input type="file" id="uploadPhotoInput" accept="image/*" style="display: none;">
        <p class="account-name" id="accountName" contenteditable="true">nama akun</p>
        <a href="form-karya.html?mode=add" class="btn-karya-baru">karya baru</a>
    </aside>

    <main class="content-grid" id="katalogGrid"></main>

    <a href="index.html" class="btn-back-login">← Keluar ke Halaman Awal</a>

    <script>
        const SUPABASE_URL = "https://lzcvyeafnksaoecepcwz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6C8omETdQ0wAfyzql73xTg_e5nDsrBK";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const isAdmin = localStorage.getItem('role') === 'admin';
        if (isAdmin) document.getElementById('adminSlider').style.display = 'flex';

        // Profil Admin
        const accountName = document.getElementById('accountName');
        const profileBox = document.getElementById('profileBox');
        const profileText = document.getElementById('profileText');

        if (localStorage.getItem('savedAdminName')) accountName.innerText = localStorage.getItem('savedAdminName');
        accountName.addEventListener('input', () => localStorage.setItem('savedAdminName', accountName.innerText));

        if (localStorage.getItem('savedAdminPhoto')) {
            profileBox.style.backgroundImage = `url(${localStorage.getItem('savedAdminPhoto')})`;
            profileText.style.display = 'none';
        }

        document.getElementById('uploadPhotoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    localStorage.setItem('savedAdminPhoto', event.target.result);
                    profileBox.style.backgroundImage = `url(${event.target.result})`;
                    profileText.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        // Muat Karya dari Supabase Database (Tabel 'tulisan')
        async function fetchKarya() {
            const { data: listKarya, error } = await _supabase
                .from('tulisan')
                .select('*')
                .order('id', { ascending: false });

            const katalogGrid = document.getElementById('katalogGrid');
            katalogGrid.innerHTML = '';

            if (error || !listKarya || listKarya.length === 0) {
                katalogGrid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #94A3B8;">Belum ada karya yang diunggah.</p>';
                return;
            }

            listKarya.forEach(item => {
                const linkTarget = isAdmin ? `form-karya.html?mode=edit&id=${item.id}` : `cerita.html?id=${item.id}`;
                const coverStyle = item.cover ? `style="background-image: url('${item.cover}');"` : '';
                
                katalogGrid.innerHTML += `
                    <a href="${linkTarget}" class="card">
                        <div class="cover-area" ${coverStyle}></div>
                        <div class="card-info">
                            <h2 class="karya-judul">${item.judul}</h2>
                            <p class="karya-tanggal">${item.tanggal}</p>
                        </div>
                    </a>
                `;
            });
        }

        fetchKarya();
    </script>
</body>
</html>
